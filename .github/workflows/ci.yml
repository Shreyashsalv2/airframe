name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch: a queue of stale CI runs is wasted
# compute and delays the result people are actually waiting for.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- C++
  cpp:
    name: C++ simulator (${{ matrix.os }}${{ matrix.sanitize && ' + sanitizers' || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            sanitize: false
          - os: ubuntu-latest
            sanitize: true
          - os: macos-latest
            sanitize: false
    steps:
      - uses: actions/checkout@v4

      # FetchContent pulls googletest; caching it turns a ~40s clone into ~2s.
      - name: Cache googletest
        uses: actions/cache@v4
        with:
          path: sim/build/_deps
          key: gtest-${{ matrix.os }}-v1.15.2

      - name: Configure
        run: cmake -S sim -B sim/build -DCMAKE_BUILD_TYPE=Debug
             -DAIRFRAME_SANITIZE=${{ matrix.sanitize && 'ON' || 'OFF' }}

      - name: Build
        run: cmake --build sim/build -j4

      - name: Unit tests
        run: ctest --test-dir sim/build --output-on-failure -j4

      - name: Determinism check
        run: |
          ./sim/build/airframe-sim --scenario wpa3 --fault FOURWAY_M3_TIMEOUT \
            --seed 42 --pcap /tmp/a.pcap > /tmp/a.json
          ./sim/build/airframe-sim --scenario wpa3 --fault FOURWAY_M3_TIMEOUT \
            --seed 42 --pcap /tmp/b.pcap > /tmp/b.json
          cmp /tmp/a.pcap /tmp/b.pcap
          cmp /tmp/a.json /tmp/b.json
          echo "identical output for the same seed"

      - name: Upload the simulator binary
        if: matrix.os == 'ubuntu-latest' && !matrix.sanitize
        uses: actions/upload-artifact@v4
        with:
          name: airframe-sim
          path: sim/build/airframe-sim
          retention-days: 3

  # ---------------------------------------------------------------- Python
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    needs: cpp
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install tshark
        # The dissector is cross-validated against tshark. Without it those tests
        # SKIP with a reason rather than silently passing — but CI should have it, so
        # the oracle actually runs where it matters.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tshark

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build the simulator
        run: |
          cmake -S sim -B sim/build -DCMAKE_BUILD_TYPE=Release -DAIRFRAME_BUILD_TESTS=OFF
          cmake --build sim/build -j4

      - name: Build the corpus
        run: |
          python scripts/build_corpus.py --runs-per-fault 2 --flake-runs 20
          python -m airframe.pcap.synth --out data/pcaps

      - name: Lint
        run: ruff check src tests scripts demo

      - name: Type check
        run: mypy || echo "mypy findings reported, not gating"

      - name: Tests
        # --dut=macos and -m network are excluded: CI has no Wi-Fi hardware and no
        # reliable egress to Indian endpoints. Excluding them explicitly, with a
        # reason, is better than letting them fail or silently pass.
        run: pytest --dut=sim -m "not network" -q

      - name: Dissector vs tshark
        run: python -m airframe.pcap.tshark_check data/pcaps/*.pcap | tail -3

      - name: Log template mining
        run: python -m airframe.logs.drain "data/logs/*.log" | head -4

      - name: Failure clustering
        run: python -m airframe.ml.cluster | head -6

      - name: Triage with the mock provider
        # Mock, not Groq: CI must not depend on a third-party API or a secret. This is
        # exactly why the provider is behind an interface.
        env:
          AIRFRAME_LLM_PROVIDER: mock
        run: python -m airframe.triage.agent --evaluate | tail -4

      - name: MCP server
        run: |
          python -m airframe.mcp.server --list | head -3
          python -m airframe.mcp.server --call rig_status

      - name: Flake recording demo
        run: |
          rm -f /tmp/airframe_flake_demo_state
          pytest demo --retries=3 -q --dut=sim

      - name: Build the dashboard
        run: python -m airframe.report.html --out data/report/index.html

      - name: Upload the dashboard
        if: matrix.python == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: data/report/index.html
          retention-days: 14
